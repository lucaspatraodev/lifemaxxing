<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0A0E17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lifemaxxing">
  <title>Lifemaxxing</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra do app: logo, nome e ajustes. Fica atrás da barra de status do iPhone. -->
  <header id="appbar">
    <div class="appbar-in">
      <span class="appbar-logo" aria-hidden="true"><svg viewBox="0 0 512 512"><defs><linearGradient id="lsol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB45C"/><stop offset="1" stop-color="#FF5A1F"/></linearGradient><radialGradient id="lbrilho" cx="50%" cy="46%" r="55%"><stop offset="0" stop-color="#FF6A1F" stop-opacity=".45"/><stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/></radialGradient><clipPath id="lceu"><rect x="0" y="0" width="512" height="300"/></clipPath></defs><rect width="512" height="512" rx="112" fill="#0A0A0B"/><rect width="512" height="512" rx="112" fill="url(#lbrilho)"/><circle cx="256" cy="292" r="124" fill="url(#lsol)" clip-path="url(#lceu)"/><path d="M86 318c38-34 72-34 106 0s68 34 106 0 72-34 128 0" fill="none" stroke="#F6F1EA" stroke-width="30" stroke-linecap="round"/><path d="M120 384c30-26 58-26 86 0s56 26 86 0 58-26 100 0" fill="none" stroke="#FF6A1F" stroke-width="26" stroke-linecap="round"/></svg></span>
      <b class="appbar-nome">Lifemaxxing</b>
      <button class="appbar-btn" data-a="ir" data-aba="ajustes" aria-label="Ajustes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg></button>
    </div>
  </header>

  <!-- Barra do simulador (só no modo teste) -->
  <div id="simbar"></div>

  <div class="app">
    <main id="view"></main>
  </div>

  <!-- Timer de descanso do treino -->
  <div id="descanso" hidden></div>
  <div id="toasts"></div>

  <!-- Menu inferior -->
  <nav class="nav">
    <button data-a="ir" data-aba="hoje"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Hoje</button>
    <button data-a="ir" data-aba="treino"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Treino</button>
    <button class="nav-ia" id="nav-ia" aria-label="Abrir o coach (toque ou arraste para cima)"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg></span></button>
    <button data-a="ir" data-aba="grana"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10.5h18M16 15h1.5"/><path d="M6 6l9-2.5 1.5 2.5"/></svg>Grana</button>
    <button data-a="ir" data-aba="progresso"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M21.5 20h-19"/></svg>Progresso</button>
  </nav>

  <!-- Motion (motion.dev) para as animações; o app funciona sem ela -->
  <script src="vendor/motion-14.10.1.js"></script>
  <script src="fx.js"></script>
  <script src="pet.js"></script>
  <script src="logos.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
