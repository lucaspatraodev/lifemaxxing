<style>

  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Plus Jakarta Sans',system-ui,sans-serif; }

  header p { margin:0; color:rgba(255,255,255,.65); }
  header span { color:#6FA0FF; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:24px; padding:24px; align-items:start; }
  figure { margin:0; }
  figure a { display:block; height:470px; overflow:hidden; border-radius:22px; background:#fff; box-shadow:0 6px 20px rgba(10,14,23,.08); }
  img { width:100%; display:block; }
  figcaption { margin-top:10px; font-size:14px; }
  figcaption b { color:var(--blue); margin-right:4px; }
</style>
